services:
  - type: web
    name: murakaza-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && DATABASE_URL="${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/db}" DIRECT_URL="${DIRECT_URL:-postgresql://postgres:postgres@localhost:5432/db}" npm run prisma:generate
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "*"
